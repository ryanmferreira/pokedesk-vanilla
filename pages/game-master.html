<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Master Dashboard</title>

    <link rel="shortcut icon" href="/favicon.svg" type="image/x-icon">

    <link rel="stylesheet" href="/css/components/loading.css">

    <link rel="stylesheet" href="/css/global-styles.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components/sidebar.css">
    <link rel="stylesheet" href="/css/components/modals.css">
    <link rel="stylesheet" href="/css/pages/session.css">
    <link rel="stylesheet" href="/css/pages/game-master.css">
</head>

<body>
    <nav>
        <button id="open-mobile-menu" type="button" class="mobile-menu-toggle">Menu</button>

        <div class="nav-header">
            <h1 id="user-name">Hello, Visitor!</h1>
            <h6 id="session-name">Session Name</h6>
        </div>

        <hr>

        <div></div>

        <div class="expand"></div>

        <div class="mobile-menu-dropdown">
            <button id="leave-session" type="button">Leave the Session</button>
        </div>
    </nav>

    <main>
        <div class="container gm-header-card">
            <div class="static-row align-between gm-header-top">
                <div class="gm-header-title">
                    <span class="panel-label">Game Master</span>
                    <h1 id="gm-session-name">Session Name</h1>
                </div>

                <button id="copy-session-id" class="red">Copy Session ID</button>
            </div>

            <hr>

            <div class="static-row align-between gm-session-id-row">
                <span class="panel-label">Session ID</span>
                <span id="gm-session-id" class="gm-session-id">-</span>
            </div>
        </div>

        <div id="players" class="grid"></div>
    </main>

    <!-- INSPECTION MODAL -->
    <div id="inspect-modal" class="modal-overlay hidden">
        <div class="modal-card container gm-inspect-modal">
            <div class="static-row align-between gm-modal-head">
                <div class="static-row gm-modal-identity">
                    <div class="avatar-box gm-modal-avatar">
                        <img id="modal-char-image" src="/assets/icons/pokeball.svg" alt="">
                    </div>

                    <div class="gm-modal-identity-text">
                        <h2 id="modal-char-name">Character Name</h2>
                        <span id="modal-char-info" class="tiny-text">Race - Class</span>
                        <span id="modal-char-role" class="type-badge gm-role-badge">PLAYER</span>
                    </div>
                </div>

                <button id="close-inspect-modal" type="button" class="red">Close</button>
            </div>

            <hr>

            <div id="modal-char-content" class="gm-modal-content">
                <!-- Character information rendered by JS -->
            </div>
        </div>
    </div>

    <!-- POKÉMON INFORMATION MODAL -->
    <div id="pokemon-attacks-modal" class="modal-overlay hidden">
        <div class="modal-card container gm-pokemon-modal">
            <div class="static-row align-between gm-modal-head">
                <div class="gm-modal-identity-text">
                    <h2 id="attacks-pokemon-name">Pokémon</h2>
                    <span id="attacks-pokemon-gender" class="tiny-text">-</span>
                    <span id="attacks-pokemon-info" class="static-row pokemon-info__types"></span>
                </div>

                <button id="close-pokemon-attacks-modal" type="button" class="red">Close</button>
            </div>

            <hr>

            <div id="pokemon-attacks-content" class="gm-modal-content">
                <!-- Pokémon information rendered by JS -->
            </div>
        </div>
    </div>

    <script type="module" src="/js/database/auth-state.js"></script>
    <script type="module" src="/js/pages/game-master.js"></script>
    <script src="/js/global-scripts.js"></script>
</body>

</html>
